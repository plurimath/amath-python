[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "plurimath-amath"
version = "0.1.0"
description = "Shared PARG raw syntax runtime for amath"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["parsanol @ git+https://github.com/parsanol/parsanol-python.git@c04eb337646af46391ecec7aa841e904a6aeb843"]
license = {text = "BSD-2-Clause"}

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amath = ["artifacts/*.json"]
